name: Deploy Production

# A push to main (a merge from staging) verifies and deploys to the production site.
# Add required reviewers to the production environment in GitHub to hold each deploy for approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a second push waits rather than cancelling a deploy mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
