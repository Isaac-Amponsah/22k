name: Deploy

# Reusable: called by deploy-staging.yml (push to staging) and deploy-production.yml (push to main).
# Never triggered directly, so the branch → environment mapping lives in exactly two places.
#
# Per GitHub environment (Settings → Environments → staging / production):
#   secrets    VPS_HOST, VPS_USER, VPS_PASSWORD, VPS_PORT (optional, default 22)
#   variables  REMOTE_PATH — the site directory on the VPS, e.g. /home/<site-user>/htdocs/<domain>
#
# Layout on the VPS (the vhost's web root is $REMOTE_PATH/current/public):
#   $REMOTE_PATH/shared/.env                 base settings; APP_ENV must equal the environment deployed
#   $REMOTE_PATH/shared/.env.<environment>   that environment's database and credentials
#   $REMOTE_PATH/releases/<timestamp>/       one directory per deploy, pruned to KEEP_RELEASES
#   $REMOTE_PATH/current                     symlink to the live release, switched last

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production. Names the GitHub environment and the APP_ENV the VPS must be set to.
        required: true
        type: string

env:
  KEEP_RELEASES: 3

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: verify

    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      REMOTE_PATH: ${{ vars.REMOTE_PATH }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}

    steps:
      - name: Check the environment is configured
        run: |
          case "$REMOTE_PATH" in
            /*/*) ;;
            *) echo "ERROR: variable REMOTE_PATH is not set for the $TARGET_ENVIRONMENT environment (an absolute site directory)." >&2; exit 1 ;;
          esac
          for required in SSHPASS VPS_HOST VPS_USER; do
            if [ -z "${!required}" ]; then
              echo "ERROR: a VPS secret is missing for the $TARGET_ENVIRONMENT environment (VPS_HOST, VPS_USER, VPS_PASSWORD)." >&2
              exit 1
            fi
          done
          echo "SSH_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Fetch the built app
        uses: actions/download-artifact@v4
        with:
          name: spa
          path: public/spa

      - name: Install sshpass + rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The env files are created once by hand on the VPS and never travel through git or CI.
      # APP_ENV must name the environment being deployed: a production site whose .env says
      # staging would run on the staging database, so the deploy stops here instead.
      - name: Prepare release directory and check env files on VPS
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_PATH/releases/$RELEASE_NAME $REMOTE_PATH/shared && \
             test -f $REMOTE_PATH/shared/.env || { echo 'ERROR: $REMOTE_PATH/shared/.env is missing — create it once on the VPS before the first deploy.' >&2; exit 1; } && \
             test -f $REMOTE_PATH/shared/.env.$TARGET_ENVIRONMENT || { echo 'ERROR: $REMOTE_PATH/shared/.env.$TARGET_ENVIRONMENT is missing — create it once on the VPS before the first deploy.' >&2; exit 1; } && \
             grep -qE '^APP_ENV=$TARGET_ENVIRONMENT[[:space:]]*\$' $REMOTE_PATH/shared/.env || { echo 'ERROR: APP_ENV in $REMOTE_PATH/shared/.env is not $TARGET_ENVIRONMENT.' >&2; exit 1; }"

      # Allow-list: only what the running app needs. Tests, the frontend source, docs and anything
      # not named here never reach the server.
      - name: Rsync release to VPS
        run: |
          sshpass -e rsync -avz --delete \
            --no-owner --no-group \
            --omit-dir-times \
            --chmod=Du=rwx,Dg=rwx,Do=rx,Fu=rw,Fg=rw,Fo=r \
            --include='/app/***' \
            --include='/config/***' \
            --include='/public/***' \
            --include='/database/' \
            --include='/database/migrate.php' \
            --include='/database/migrations/***' \
            --include='/bin/***' \
            --include='/composer.json' \
            --include='/composer.lock' \
            --exclude='*' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$REMOTE_PATH/releases/$RELEASE_NAME/"

      - name: Link env files into release
        run: |
          RELEASE_PATH="$REMOTE_PATH/releases/$RELEASE_NAME"
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "ln -sf $REMOTE_PATH/shared/.env $RELEASE_PATH/.env && \
             ln -sf $REMOTE_PATH/shared/.env.$TARGET_ENVIRONMENT $RELEASE_PATH/.env.$TARGET_ENVIRONMENT"

      - name: Composer install on VPS
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_PATH/releases/$RELEASE_NAME && composer install --no-dev --optimize-autoloader --no-interaction --no-progress"

      # Runs before the release is activated, so a failed migration — or a failed isolation
      # check at the end of migrate.php — leaves $REMOTE_PATH/current on the previous release.
      - name: Run database migrations on VPS
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_PATH/releases/$RELEASE_NAME && php database/migrate.php"

      - name: Activate release and prune old ones
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "ln -sfn $REMOTE_PATH/releases/$RELEASE_NAME $REMOTE_PATH/current && \
             cd $REMOTE_PATH/releases && ls -1dt */ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf"
