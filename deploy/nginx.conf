# Production vhost for https://22k.aidingminds.org
#
# Site directory: /home/aidingminds-22k/htdocs/22k.aidingminds.org — the remote_path input in deploy-production.yml.
# The {{…}} placeholders are filled in by the hosting panel, as on the other sites of this VPS.
# The app binds no port of its own: PHP-FPM serves /api, nginx serves the built single-page app.

# ─── HTTP → HTTPS ─────────────────────────────────────────────
server {
  server_tokens off;
  listen 80;
  listen [::]:80;

  server_name 22k.aidingminds.org;

  # Certificate issuance and renewal answer over plain HTTP.
  location ^~ /.well-known/acme-challenge/ {
    root  /home/aidingminds-22k/htdocs/22k.aidingminds.org;
    allow all;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS ────────────────────────────────────────────────────
server {
  server_tokens off;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  {{ssl_certificate}}
  {{ssl_certificate_key}}

  server_name 22k.aidingminds.org;

  # "current" is the symlink the deploy switches last. $realpath_root below makes PHP-FPM see the
  # release directory itself, so a deploy takes effect at once instead of when opcache next looks.
  root  /home/aidingminds-22k/htdocs/22k.aidingminds.org/current/public;
  index index.php;

  # A payroll workbook upload is capped at 2 MB by the app.
  client_max_body_size 4M;

  access_log /var/log/nginx/22k.aidingminds.org.access.log;
  error_log  /var/log/nginx/22k.aidingminds.org.error.log;

  # Pay, account numbers and tax figures pass through here: strict transport, no framing, no sniffing,
  # and the browser features the app never uses switched off.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built app assets carry a content hash in their name, so they can be cached for good. add_header here
  # replaces the server-level headers for this block, so the ones that matter for a file are repeated.
  location ^~ /spa/assets/ {
    expires max;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else: a real file if there is one, otherwise the front controller, which answers
  # /api/* and serves the app's index.html for every browser route.
  location / {
    try_files $uri /index.php?$query_string;
  }

  location = /index.php {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
    fastcgi_param HTTPS           "on";
    fastcgi_param SERVER_PORT     443;
    fastcgi_param PHP_VALUE       "session.auto_start=0";

    # Sending payroll to a bank waits on the mail server (up to 20 s in the app); 120 s leaves room.
    fastcgi_read_timeout 120;
  }

  # No other PHP file is reachable, and no dotfile (.env, .git).
  location ~ \.php$ {
    return 404;
  }

  location ~ /\. {
    deny all;
  }
}
